<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JFT Basic A2 Trainer</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Panel belajar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span>日</span>
          </div>
          <div>
            <p class="eyebrow">JFT Basic A2</p>
            <h1>Latihan Bahasa Jepang</h1>
          </div>
        </div>

        <div class="stats-grid" aria-label="Statistik">
          <div class="metric">
            <span class="metric-value" id="metricAnswered">0</span>
            <span class="metric-label">Dijawab</span>
          </div>
          <div class="metric">
            <span class="metric-value" id="metricAccuracy">0%</span>
            <span class="metric-label">Akurasi</span>
          </div>
          <div class="metric">
            <span class="metric-value" id="metricStreak">0</span>
            <span class="metric-label">Streak</span>
          </div>
          <div class="metric">
            <span class="metric-value" id="metricReview">0</span>
            <span class="metric-label">Review</span>
          </div>
        </div>

        <div class="control-block">
          <label for="sectionFilter">Bagian</label>
          <select id="sectionFilter">
            <option value="all">Semua</option>
            <option value="Grammar">Grammar</option>
            <option value="Expression">Expression</option>
            <option value="Vocabulary">Kosakata/Kanji</option>
            <option value="Reading">Membaca</option>
          </select>
        </div>

        <div class="control-block">
          <label for="categoryFilter">Kategori</label>
          <select id="categoryFilter"></select>
        </div>

        <div class="mode-tabs" role="tablist" aria-label="Mode">
          <button class="mode-tab is-active" data-view="practice" role="tab" aria-selected="true">
            <span class="icon" aria-hidden="true">▶</span>
            Latihan
          </button>
          <button class="mode-tab" data-view="test" role="tab" aria-selected="false">
            <span class="icon" aria-hidden="true">✓</span>
            Tes 20
          </button>
          <button class="mode-tab" data-view="mock" role="tab" aria-selected="false">
            <span class="icon" aria-hidden="true">◴</span>
            Simulasi 50
          </button>
          <button class="mode-tab" data-view="bank" role="tab" aria-selected="false">
            <span class="icon" aria-hidden="true">▦</span>
            Bank Soal
          </button>
          <button class="mode-tab" data-view="review" role="tab" aria-selected="false">
            <span class="icon" aria-hidden="true">↻</span>
            Review
          </button>
        </div>

        <button class="sidebar-reset-button" id="sidebarResetBtn" type="button">
          <span aria-hidden="true">↺</span>
          Reset progres
        </button>
      </aside>

      <main class="workspace">
        <header class="toolbar">
          <div class="toolbar-title">
            <p id="toolbarMeta">140 soal latihan</p>
            <h2 id="viewTitle">Latihan</h2>
          </div>
          <div class="toolbar-actions">
            <button class="icon-button" id="shuffleBtn" type="button" title="Acak soal" aria-label="Acak soal">
              <span aria-hidden="true">⤨</span>
            </button>
            <button class="toolbar-button reset-action" id="resetBtn" type="button" title="Reset progres" aria-label="Reset progres">
              <span aria-hidden="true">↺</span>
              Reset
            </button>
          </div>
        </header>

        <section class="practice-view view is-visible" id="practiceView" aria-live="polite">
          <div class="question-layout">
            <article class="question-panel">
              <div class="question-head">
                <div>
                  <span class="tag" id="questionSection">Grammar</span>
                  <span class="tag tag-muted" id="questionCategory">て形</span>
                </div>
                <strong id="questionNumber">No. 1</strong>
              </div>
              <div class="question-actions question-actions-top" aria-label="Navigasi soal bagian atas">
                <button class="secondary-button" id="topPrevBtn" type="button">
                  <span aria-hidden="true">‹</span>
                  Sebelumnya
                </button>
                <button class="primary-button" id="topNextBtn" type="button">
                  Berikutnya
                  <span aria-hidden="true">›</span>
                </button>
              </div>
              <p class="scenario" id="scenarioText"></p>
              <div class="dialogue" id="dialogueBox"></div>
              <div class="choices" id="choicesBox"></div>
              <div class="feedback" id="feedbackBox" hidden></div>
              <div class="question-actions">
                <button class="secondary-button" id="prevBtn" type="button">
                  <span aria-hidden="true">‹</span>
                  Sebelumnya
                </button>
                <button class="primary-button" id="nextBtn" type="button">
                  Berikutnya
                  <span aria-hidden="true">›</span>
                </button>
              </div>
            </article>

            <aside class="learning-panel" aria-label="Ringkasan soal">
              <div class="mini-visual" aria-hidden="true">
                <div class="flash-card card-a">JFT</div>
                <div class="flash-card card-b">A2</div>
                <div class="pencil"></div>
              </div>
              <div class="pattern-box">
                <span id="patternLabel">Petunjuk</span>
                <strong id="patternText">Vて + います</strong>
              </div>
              <div class="pattern-box">
                <span id="meaningLabel">Status</span>
                <strong id="meaningText">sedang / keadaan</strong>
              </div>
              <div class="mini-progress">
                <div class="progress-bar">
                  <span id="progressFill"></span>
                </div>
                <p id="progressText">1 / 35</p>
              </div>
            </aside>
          </div>
        </section>

        <section class="bank-view view" id="bankView">
          <div class="bank-toolbar">
            <label class="search-field" for="searchInput">
              <span aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="Cari pola, arti, atau kalimat Jepang" />
            </label>
          </div>
          <div class="question-list" id="questionList"></div>
        </section>

        <section class="review-view view" id="reviewView">
          <div class="review-summary" id="reviewSummary"></div>
          <div class="question-list" id="reviewList"></div>
        </section>
      </main>
    </div>
  </body>
</html>
